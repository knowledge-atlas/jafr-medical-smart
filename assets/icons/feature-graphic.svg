<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="50%" stop-color="#1a3b5d"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d76e"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="500" fill="url(#bg)"/>
  
  <!-- الأيقونة يسار -->
  <g transform="translate(100, 90)">
    <polygon points="160,20 235,55 270,130 235,205 160,240 85,205 50,130 85,55" 
             fill="none" stroke="url(#gold)" stroke-width="4"/>
    <polygon points="160,50 215,80 240,130 215,180 160,210 105,180 80,130 105,80" 
             fill="#0f2438" stroke="url(#gold)" stroke-width="2"/>
    <text x="160" y="185" font-family="serif" font-size="120" font-weight="900"
          text-anchor="middle" fill="url(#gold)">ج</text>
  </g>
  
  <!-- النص يمين -->
  <text x="600" y="220" font-family="serif" font-size="58" font-weight="bold"
        text-anchor="middle" fill="#d4af37">الجفر التراثي الذكي</text>
  
  <text x="600" y="280" font-family="sans-serif" font-size="26"
        text-anchor="middle" fill="#e8e8e8">نظام التحليل الرمزي</text>
  
  <text x="600" y="350" font-family="sans-serif" font-size="20"
        text-anchor="middle" fill="#a0a0a0">اعرف ملامح طبعك وأنماط من حولك</text>
  <text x="600" y="385" font-family="sans-serif" font-size="20"
        text-anchor="middle" fill="#a0a0a0">عبر قراءة رمزية تراثية لاسمك</text>
  
  <!-- خط ذهبي -->
  <line x1="440" y1="420" x2="760" y2="420" stroke="url(#gold)" stroke-width="2"/>
</svg>
