<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body {
    margin: 0;
    width: 1080px;
    height: 1920px;
    background: linear-gradient(180deg, #0a1628 0%, #1a3b5d 50%, #0d1117 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: 'Arial', sans-serif;
    color: #fff;
    position: relative;
    overflow: hidden;
  }
  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    opacity: 0.15;
  }
  .icon {
    font-size: 120px;
    margin-bottom: 40px;
    text-shadow: 0 0 40px #d4af37;
  }
  .main-title {
    font-size: 72px;
    font-weight: bold;
    color: #d4af37;
    text-align: center;
    text-shadow: 0 0 30px rgba(212, 175, 55, 0.5);
    margin-bottom: 20px;
    padding: 0 40px;
  }
  .divider {
    width: 400px;
    height: 2px;
    background: linear-gradient(90deg, transparent, #d4af37, transparent);
    margin: 20px 0;
  }
  .subtitle {
    font-size: 32px;
    color: #c0c0c0;
    font-style: italic;
    margin-bottom: 60px;
  }
  .tagline {
    font-size: 22px;
    color: #ecf0f1;
    opacity: 0.8;
    font-style: italic;
    text-align: center;
    padding: 0 80px;
    line-height: 1.6;
  }
  .version {
    position: absolute;
    bottom: 80px;
    font-size: 18px;
    color: #7f8c8d;
  }
</style>
</head>
<body>
  <!-- نجوم عشوائية -->
  <div class="star" style="top: 10%; left: 15%; width: 4px; height: 4px;"></div>
  <div class="star" style="top: 20%; left: 80%; width: 3px; height: 3px;"></div>
  <div class="star" style="top: 35%; left: 25%; width: 5px; height: 5px;"></div>
  <div class="star" style="top: 55%; left: 70%; width: 4px; height: 4px;"></div>
  <div class="star" style="top: 75%; left: 20%; width: 3px; height: 3px;"></div>
  <div class="star" style="top: 85%; left: 85%; width: 4px; height: 4px;"></div>
  <div class="star" style="top: 15%; left: 50%; width: 3px; height: 3px;"></div>
  <div class="star" style="top: 65%; left: 40%; width: 5px; height: 5px;"></div>

  <div class="icon">⚖️</div>
  <div class="main-title">نِظَام الجَفْر<br>الطِّبِّي الذَّكِي</div>
  <div class="divider"></div>
  <div class="subtitle">ميزان المرآة الذكي</div>
  <div class="tagline">"حيث تنعكس روحك على ميزان دقيق"</div>
  <div class="version">الإصدار 2.0 — 2026</div>
</body>
</html>
