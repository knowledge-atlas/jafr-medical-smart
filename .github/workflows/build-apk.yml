name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup SDK & NDK (manual)
        run: |
          SDK_ROOT=/usr/local/lib/android/sdk
          SDKMGR=$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKMGR --licenses > /dev/null 2>&1 || true
          yes | $SDKMGR --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.1.12297006" 2>&1 | tail -5
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
      - name: Install deps
        run: npm install --legacy-peer-deps
      - name: Prebuild
        run: npx expo prebuild -p android --clean
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: jafr-apk
          path: android/app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: |
            android/**/*.log
          retention-days: 7
