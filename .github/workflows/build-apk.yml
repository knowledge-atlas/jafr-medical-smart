name: Build APK

on:
  push:
    branches: [main, commercial-v1.0.0]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup SDK & NDK
        run: |
          SDK_ROOT=/usr/local/lib/android/sdk
          SDKMGR=$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKMGR --licenses > /dev/null 2>&1 || true
          yes | $SDKMGR --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.1.12297006" 2>&1 | tail -5
          
      - name: Install deps
        run: npm install --legacy-peer-deps

      - name: Prebuild
        run: npx expo prebuild -p android --clean

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: build-v1.0.0-${{ github.run_number }}
          name: "التطبيق جاهز - Build ${{ github.run_number }}"
          files: android/app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
