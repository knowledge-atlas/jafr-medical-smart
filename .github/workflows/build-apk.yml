name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (fixed)
        run: |
          set -e
          SDK_ROOT=$ANDROID_SDK_ROOT
          if [ -z "$SDK_ROOT" ]; then SDK_ROOT=$ANDROID_HOME; fi
          if [ -z "$SDK_ROOT" ]; then SDK_ROOT=/usr/local/lib/android/sdk; fi

          echo "SDK_ROOT=$SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          # ابحث عن sdkmanager
          SDKMGR=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$SDKMGR" ]; then
            echo "sdkmanager not found, installing commandline-tools"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            cd "$SDK_ROOT"
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
            unzip -q cmdline-tools.zip
            mkdir -p cmdline-tools/latest
            mv cmdline-tools/bin cmdline-tools/lib cmdline-tools/NOTICE.txt cmdline-tools/source.properties cmdline-tools/latest/ 2>/dev/null || true
            rm -f cmdline-tools.zip
            SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "Using sdkmanager: $SDKMGR"
          chmod +x "$SDKMGR" 2>/dev/null || true

          # قبول التراخيص
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true

          # تثبيت مكونات مطلوبة (بدون 'tools' القديم)
          yes | "$SDKMGR" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.1.12297006" 2>&1 | tail -20 || true

          # تصدير SDK_ROOT للخطوات التالية
          echo "SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Verify environment
        run: |
          echo "=== Node ==="
          node --version
          echo "=== Java ==="
          java -version
          echo "=== SDK ==="
          ls $SDK_ROOT 2>/dev/null || ls $ANDROID_SDK_ROOT
          echo "=== NDK ==="
          ls $SDK_ROOT/ndk 2>/dev/null || echo "NDK not yet installed"

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Generate native code
        run: npx expo prebuild -p android --clean 2>&1 | tee prebuild.log

      - name: Build APK
        working-directory: android
        env:
          ANDROID_HOME: ${{ env.SDK_ROOT }}
          ANDROID_SDK_ROOT: ${{ env.SDK_ROOT }}
        run: ./gradlew assembleRelease --no-daemon 2>&1 | tee ../gradle-build.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            prebuild.log
            gradle-build.log
          retention-days: 7

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jafr-medical-smart-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
